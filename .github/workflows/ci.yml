name: SEO and site CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit all production and development dependencies
        run: npm audit --audit-level=low
      - name: Dependency security and compatibility checks
        run: npm run test:dependencies
      - run: npm run lint
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: PHP delivery syntax and isolated HTTP checks (no real email)
        run: |
          php -l public/inaya-enquiry.php
          python3 tests/form-delivery-backend.py
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
      - name: Compile focused unit helpers
        run: node node_modules/typescript/bin/tsc lib/json-ld.ts lib/structured-data.ts lib/image-alt.ts lib/content-architecture.ts lib/guide-content.ts lib/buyer-answers.ts lib/measurement.ts --outDir .next/phase-02-unit --rootDir . --module commonjs --target es2020 --esModuleInterop --skipLibCheck
      - name: Verify image discovery, primary images and favicon files
        run: node --test tests/image-search-export.test.mjs
      - name: Verify concise unique search titles
        run: node --test tests/search-title-export.test.mjs
      - name: Unit and export checks
        run: node --test tests/seo-phase02-unit.test.cjs tests/seo-phase03-unit.test.cjs tests/seo-phase04-unit.test.cjs tests/seo-phase05-unit.test.cjs tests/seo-final-remediation-unit.test.cjs tests/final-ux-accessibility-unit.test.cjs tests/seo-export.test.mjs tests/seo-phase02-export.test.mjs tests/seo-phase03-export.test.mjs tests/seo-phase04-export.test.mjs tests/seo-phase05-export.test.mjs tests/seo-bilingual-guides-export.test.mjs tests/seo-visual-content-export.test.mjs tests/final-ux-accessibility-export.test.mjs tests/seo-release-readiness.test.mjs tests/customer-question-series.test.mjs tests/article-publication-schedule.test.mjs
      - name: Install Chromium for browser regression
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check pricing layout before the full browser suite
        run: node node_modules/@playwright/test/cli.js test tests/e2e/core-page-clarity.spec.ts --grep 'six pricing cards'
      - name: Check customer article tables, visuals and translation before the full browser suite
        run: node node_modules/@playwright/test/cli.js test tests/e2e/customer-question-series.spec.ts
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser regression
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Browser regression
        run: node node_modules/@playwright/test/cli.js test --shard=${{ matrix.shard }}/4
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Keep the existing required check: every shard and quality check must pass.
  validate:
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success
