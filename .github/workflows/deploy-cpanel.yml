name: Deploy to cPanel

on:
  push:
    branches:
      - main
    # These files cannot change the exported website. Manual deploy stays available.
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-cpanel.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A baseline is reliable only when deployments cannot overlap.
concurrency:
  group: inaya-cpanel-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test IndexNow notification selection
        run: node --test tests/indexnow-notify.test.mjs

      - name: Verify dependency security and compatibility
        run: npm run test:dependencies

      - name: Prepare static export
        run: |
          cp next.config.cpanel.js next.config.js
          sed -i "/force-dynamic/d" app/[locale]/layout.tsx
          rm -rf app/api
          cp public/images/home/candidates/elite-candidate-nanny.webp public/images/home/candidate-executive-nanny.webp
          cp public/images/home/candidates/elite-candidate-chef.webp public/images/home/candidate-private-chef.webp
          cp public/images/home/candidates/elite-candidate-house-manager.webp public/images/home/candidate-house-manager.webp

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
        run: npm run build

      - name: Optimize exported images
        run: |
          node -e "require('sharp')"
          node <<'NODE'
          const fs = require('fs/promises');
          const path = require('path');
          const sharp = require('sharp');

          const outDir = path.resolve('out');
          const replacements = [];

          async function walk(dir) {
            const entries = await fs.readdir(dir, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...await walk(fullPath));
              else files.push(fullPath);
            }
            return files;
          }

          function toWebPath(filePath) {
            return path.relative(outDir, filePath).split(path.sep).join('/');
          }

          function withoutExt(webPath) {
            return webPath.replace(/\.[^.]+$/i, '');
          }

          function maxWidthFor(webPath) {
            if (webPath.startsWith('authority-logos/')) return 320;
            if (webPath.startsWith('brand/')) return 620;
            if (webPath.startsWith('images/services/')) return 900;
            if (webPath.startsWith('images/home/')) return 1400;
            if (webPath.startsWith('images/countries/')) return 900;
            if (webPath.startsWith('images/service-areas/')) return 900;
            return 1200;
          }

          function variantWidthsFor(webPath) {
            if (webPath.startsWith('authority-logos/')) return [160, 320];
            if (webPath.startsWith('brand/')) return [160, 320, 620];
            if (webPath.startsWith('images/home/')) return [480, 768, 960, 1200, 1400];
            if (webPath.startsWith('images/services/')) return [480, 768, 900];
            if (webPath.startsWith('images/countries/')) return [480, 768, 900];
            return [480, 768, 960, 1200];
          }

          async function writeResponsiveVariants(filePath, metadata) {
            const ext = path.extname(filePath).toLowerCase();
            if (!['.webp', '.png', '.jpg', '.jpeg'].includes(ext)) return;

            const webPath = toWebPath(filePath);
            if (webPath.startsWith('optimized/')) return;

            const sourceWidth = metadata.width || 0;
            const widths = variantWidthsFor(webPath).filter((width) => !sourceWidth || width <= sourceWidth + 80);
            if (!widths.length) widths.push(Math.min(sourceWidth || 480, 480));

            for (const width of widths) {
              const targetWebPath = `optimized/${withoutExt(webPath)}-${width}.webp`;
              const targetPath = path.join(outDir, targetWebPath);
              await fs.mkdir(path.dirname(targetPath), { recursive: true });
              await sharp(filePath)
                .resize({ width, withoutEnlargement: true })
                .webp({ quality: webPath.startsWith('authority-logos/') || webPath.startsWith('brand/') ? 78 : webPath === 'images/home/inaya-home-hero-family.webp' ? 65 : 70, effort: 6 })
                .toFile(targetPath);
            }
          }

          async function optimizeImage(filePath) {
            const ext = path.extname(filePath).toLowerCase();
            if (!['.webp', '.png', '.jpg', '.jpeg'].includes(ext)) return;

            const webPath = toWebPath(filePath);
            if (webPath.startsWith('optimized/')) return;
            // Prepared gallery originals and thumbnails already have suitable sizes.
            // Preserve their verified metadata and avoid redundant variants.
            if (webPath.startsWith('images/company-gallery/')) return;

            const maxWidth = maxWidthFor(webPath);
            const metadata = await sharp(filePath).metadata();
            await writeResponsiveVariants(filePath, metadata);
            const shouldResize = metadata.width && metadata.width > maxWidth;

            if (ext === '.png' && (webPath.startsWith('authority-logos/') || webPath.startsWith('brand/'))) {
              const nextWebPath = webPath.replace(/\.png$/i, '.webp');
              const webpFile = path.join(outDir, nextWebPath);
              await sharp(filePath)
                .resize({ width: maxWidth, withoutEnlargement: true })
                .webp({ quality: 74, effort: 6 })
                .toFile(webpFile);
              replacements.push([`/${webPath}`, `/${nextWebPath}`]);
              replacements.push([webPath, nextWebPath]);
              return;
            }

            if (!shouldResize && ext === '.png') return;

            const tempFile = `${filePath}.optimized`;
            let image = sharp(filePath).resize({ width: maxWidth, withoutEnlargement: true });

            if (ext === '.webp') image = image.webp({ quality: 72, effort: 6 });
            if (ext === '.jpg' || ext === '.jpeg') image = image.jpeg({ quality: 74, progressive: true, mozjpeg: true });
            if (ext === '.png') image = image.png({ compressionLevel: 9, adaptiveFiltering: true, palette: true });

            await image.toFile(tempFile);
            await fs.rename(tempFile, filePath);
          }

          async function applyReplacements(files) {
            if (!replacements.length) return;
            const textExtensions = new Set(['.html', '.js', '.css', '.txt']);
            for (const filePath of files) {
              if (!textExtensions.has(path.extname(filePath).toLowerCase())) continue;
              let content = await fs.readFile(filePath, 'utf8');
              let nextContent = content;
              for (const [from, to] of replacements) nextContent = nextContent.split(from).join(to);
              if (nextContent !== content) await fs.writeFile(filePath, nextContent);
            }
          }

          (async () => {
            const files = await walk(outDir);
            for (const file of files) {
              try { await optimizeImage(file); }
              catch (error) { console.warn(`Skipped image optimization for ${file}: ${error.message}`); }
            }
            const nextFiles = await walk(outDir);
            await applyReplacements(nextFiles);
            console.log(`Optimized exported images and generated responsive variants. Modernized ${replacements.length / 2} PNG references.`);
          })();
          NODE

      - name: Add cPanel root files
        run: |
          cp .github/cpanel.htaccess out/.htaccess
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>INAYA Domestic Workers</title>
              <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
              <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png">
              <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
              <link rel="alternate" hreflang="en" href="/en/">
              <link rel="alternate" hreflang="ar" href="/ar/">
              <script>
                (function () {
                  var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
                  var isArabic = languages.some(function (language) { return String(language).toLowerCase().indexOf('ar') === 0; });
                  window.location.replace(isArabic ? '/ar/' : '/en/');
                })();
              </script>
              <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
            </head>
            <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf7;color:#07164A;font-family:system-ui,sans-serif;">
              <p>Redirecting to INAYA Domestic Workers...</p>
            </body>
          </html>
          EOF

      - name: Find last successful deployment baseline
        id: baseline
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // A rerun may follow a partial transfer from this same run ID.
            if (Number(process.env.GITHUB_RUN_ATTEMPT) > 1) {
              core.info('Rerun: compare current deployed files to repair any partial transfer.');
              return;
            }
            try {
              const repo = context.repo;
              const { data: current } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: context.runId });
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...repo, workflow_id: current.workflow_id, per_page: 100,
              });
              const previous = runs
                // Completion/update order also accounts for reruns of older run IDs.
                .filter(run => run.id !== context.runId && run.status !== 'queued')
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at) || b.run_number - a.run_number)[0];
              // Do not use an older success after a failed/cancelled attempt: FTP may be partially changed.
              if (!previous || previous.status !== 'completed' || previous.conclusion !== 'success') {
                core.info('No reliable successful baseline after the latest deployment attempt; compare current deployed files.');
                return;
              }
              const name = `inaya-cpanel-baseline-${previous.id}-${previous.run_attempt}`;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...repo, run_id: previous.id, per_page: 100,
              });
              if (!artifacts.some(artifact => artifact.name === name && !artifact.expired)) {
                core.info('Latest successful deployment has no retained baseline; compare current deployed files.');
                return;
              }
              core.setOutput('run_id', String(previous.id));
              core.setOutput('artifact_name', name);
              core.info(`Reuse the final export from successful deployment run ${previous.id}.`);
            } catch {
              core.warning('Baseline discovery unavailable; compare current deployed files.');
            }

      - name: Restore successful deployment baseline
        id: restore-baseline
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inaya-ftp-restored-baseline

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Compare against current deployed files when no retained baseline exists
        if: steps.restore-baseline.outcome != 'success'
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
        run: |
          node .github/scripts/cpanel-incremental.mjs include-paths ./out "$RUNNER_TEMP/inaya-ftp-current-paths.txt"
          lftp -u "$CPANEL_FTP_USER","$CPANEL_FTP_PASSWORD" "$CPANEL_FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:list-options -a
          set net:max-retries 3
          set net:timeout 30
          mirror --verbose --parallel=2 --recursion=always \
            --include-glob-from="$RUNNER_TEMP/inaya-ftp-current-paths.txt" \
            --exclude-glob .well-known \
            --exclude-glob .well-known/** \
            --exclude-glob .ftp-deploy-sync-state.json \
            "$CPANEL_FTP_SERVER_DIR" "$RUNNER_TEMP/inaya-ftp-current-remote"
          bye
          EOF
          node .github/scripts/cpanel-incremental.mjs remote-snapshot \
            "$RUNNER_TEMP/inaya-ftp-current-remote" "$RUNNER_TEMP/inaya-ftp-restored-baseline"

      - name: Select new and changed exported files
        id: selection
        env:
          BASELINE_RESTORED: 'true'
        run: |
          node .github/scripts/cpanel-incremental.mjs compare \
            ./out "$RUNNER_TEMP/inaya-ftp-restored-baseline" "$RUNNER_TEMP/inaya-ftp-selected"

      - name: Deploy to cPanel
        if: steps.selection.outputs.selected_files != '0'
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
        run: |
          lftp -u "$CPANEL_FTP_USER","$CPANEL_FTP_PASSWORD" "$CPANEL_FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:list-options -a
          set net:max-retries 3
          set net:timeout 30
          set mirror:parallel-directories true
          mirror --reverse --verbose --parallel=4 --overwrite --transfer-all --ignore-time --recursion=always \
            --exclude-glob .well-known \
            --exclude-glob .well-known/** \
            --exclude-glob .ftp-deploy-sync-state.json \
            "$RUNNER_TEMP/inaya-ftp-selected/" "$CPANEL_FTP_SERVER_DIR"
          bye
          EOF

      # These steps run only after a successful transfer (or an unchanged export).
      # The next run also requires this entire workflow to have completed successfully.
      - name: Prepare successful deployment baseline
        run: |
          node .github/scripts/cpanel-incremental.mjs snapshot ./out "$RUNNER_TEMP/inaya-ftp-next-baseline"

      - name: Save successful deployment baseline
        uses: actions/upload-artifact@v7.0.2
        with:
          name: inaya-cpanel-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inaya-ftp-next-baseline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # Notify only after upload and baseline persistence succeed. A search
      # endpoint failure must not turn a successful site deploy into a failure.
      - name: Notify IndexNow of deployed page changes
        id: indexnow
        continue-on-error: true
        run: |
          node .github/scripts/indexnow-notify.mjs \
            "$RUNNER_TEMP/inaya-ftp-selected" "$RUNNER_TEMP/inaya-ftp-restored-baseline" \
            "$RUNNER_TEMP/inaya-indexnow-result.json"

      - name: Save IndexNow notification result
        if: always() && steps.indexnow.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: inaya-indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inaya-indexnow-result.json
          if-no-files-found: warn
          retention-days: 30
